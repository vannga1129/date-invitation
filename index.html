<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Date Invitation 💕</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.8), transparent 30%),
        radial-gradient(circle at 85% 15%, rgba(255,210,225,.55), transparent 25%),
        linear-gradient(135deg, #f8e9ef, #f3f0ef 45%, #f8dce5);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      color: #bf3d69;
    }

    .app {
      width: min(92vw, 440px);
      position: relative;
      z-index: 2;
      padding: 24px 0;
    }

    .card {
      background: rgba(255,255,255,.58);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.72);
      box-shadow: 0 18px 45px rgba(82, 52, 64, .18);
      border-radius: 22px;
      padding: 28px 24px;
      text-align: center;
      animation: pop .45s ease;
    }

    @keyframes pop {
      from { opacity: 0; transform: translateY(12px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    h1, h2 {
      margin: 0 0 24px;
      font-weight: 500;
      line-height: 1.18;
    }

    h1 { font-size: 28px; }
    h2 { font-size: 27px; }

    .buttons {
      position: relative;
      min-height: 100px;
      margin-top: 10px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 26px;
      cursor: pointer;
      font-weight: 700;
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
      font-family: Arial, sans-serif;
    }

    button:active { transform: scale(.97); }

    #yesBtn {
      width: 100%;
      background: #cf3f73;
      color: white;
      box-shadow: 0 8px 20px rgba(207,63,115,.28);
      font-size: 15px;
      margin-bottom: 14px;
    }

    #noBtn {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: #f2ecee;
      color: #6f6065;
      font-size: 12px;
      padding: 8px 18px;
    }

    .hidden { display: none; }

    label {
      display: block;
      text-align: left;
      color: #6f6065;
      font: 600 13px Arial, sans-serif;
      margin: 12px 0 6px;
    }

    input[type="date"] {
      width: 100%;
      border: 1px solid #e8d9df;
      background: rgba(255,255,255,.74);
      border-radius: 14px;
      padding: 13px 14px;
      font: 15px Arial, sans-serif;
      color: #5e5055;
      outline: none;
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 8px 0 16px;
    }

    .time-btn, .food-btn {
      padding: 9px 6px;
      font-size: 11px;
      background: rgba(255,255,255,.72);
      color: #6d5c63;
      border: 1px solid #e9dbe0;
    }

    .time-btn.selected, .food-btn.selected {
      background: #cf3f73;
      color: white;
      border-color: #cf3f73;
    }

    .food-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 8px 0 16px;
    }

    .food-btn {
      min-height: 48px;
      font-size: 13px;
    }

    .primaryBtn {
      width: 100%;
      background: #e7dfe2;
      color: #8e7c83;
      font-size: 14px;
    }

    .primaryBtn.ready {
      background: #cf3f73;
      color: white;
      box-shadow: 0 8px 20px rgba(207,63,115,.22);
    }

    .backBtn {
      margin-top: 12px;
      background: transparent;
      color: #a26a7f;
      padding: 8px 14px;
      font-size: 12px;
    }

    .summary {
      text-align: left;
      background: rgba(255,255,255,.54);
      border: 1px solid rgba(230,214,220,.9);
      border-radius: 16px;
      padding: 14px 16px;
      margin: 16px 0 18px;
      color: #6a5960;
      font: 14px/1.7 Arial, sans-serif;
    }

    .summary div {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .big-love {
      font-size: 34px;
      margin-bottom: 14px;
    }

    .note {
      color: #b45a77;
      font-size: 16px;
      margin-top: 6px;
    }

    .small {
      font: 11px/1.5 Arial, sans-serif;
      color: #8a7a80;
      margin-top: 24px;
    }

    .confetti {
      position: fixed;
      top: -20px;
      width: 8px;
      height: 14px;
      opacity: .9;
      z-index: 10;
      animation: fall linear forwards;
      border-radius: 2px;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(760deg);
        opacity: .9;
      }
    }

    .floating-heart {
      position: fixed;
      bottom: -30px;
      font-size: 18px;
      opacity: .22;
      animation: floatUp 8s linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      to {
        transform: translateY(-115vh) translateX(30px) rotate(20deg);
        opacity: 0;
      }
    }

    @media (max-width: 420px) {
      .card { padding: 24px 18px; }
      h1 { font-size: 24px; }
      h2 { font-size: 24px; }
      .time-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <section id="step1" class="card">
      <h1>🌸 Will you go on a<br>date with me? 🌸</h1>
      <div class="buttons" id="buttonArea">
        <button id="yesBtn">YES ♥</button>
        <button id="noBtn">NO 😶</button>
      </div>
    </section>

    <section id="step2" class="card hidden">
      <h2>So... when are you free? 💌</h2>

      <label for="dateInput">Pick a day</label>
      <input id="dateInput" type="date" />

      <label>What time?</label>
      <div class="time-grid" id="timeGrid"></div>

      <button id="continueBtn" class="primaryBtn">Continue ♥</button>
    </section>

    <section id="step3" class="card hidden">
      <h2>What should we eat? 🍽️</h2>

      <div class="food-grid" id="foodGrid"></div>

      <button id="confirmBtn" class="primaryBtn">Confirm our date ♥</button>
      <button id="backBtn" class="backBtn">← Back</button>
    </section>

    <section id="step4" class="card hidden">
      <div class="big-love">YAY!! 💕</div>
      <div class="summary">
        <div>📅 <span id="chosenDate"></span></div>
        <div>⏰ <span id="chosenTime"></span></div>
        <div>🍽️ <span id="chosenFood"></span></div>
      </div>
      <div class="note">I can't wait to see you! 🌷✨</div>
      <div class="small">
        Bring your best smile. I made a website on purpose,<br>
        so you basically have to say yes 😌
      </div>
    </section>
  </div>

  <script>
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const step3 = document.getElementById('step3');
    const step4 = document.getElementById('step4');

    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const buttonArea = document.getElementById('buttonArea');

    const dateInput = document.getElementById('dateInput');
    const timeGrid = document.getElementById('timeGrid');
    const foodGrid = document.getElementById('foodGrid');
    const continueBtn = document.getElementById('continueBtn');
    const confirmBtn = document.getElementById('confirmBtn');
    const backBtn = document.getElementById('backBtn');

    let selectedTime = '';
    let selectedFood = '';

    const times = [
      '12:00 PM', '1:00 PM', '2:00 PM', '3:00 PM',
      '4:00 PM', '5:00 PM', '6:00 PM', '6:30 PM',
      '7:00 PM', '7:30 PM', '8:00 PM', '8:30 PM'
    ];

    const foods = [
      '🍝 Pasta',
      '🍣 Sushi',
      '🍕 Pizza',
      '🥩 Steak',
      '🍜 Ramen',
      '🌮 Tacos',
      '🍛 Curry',
      '🥗 Surprise me!'
    ];

    times.forEach(time => {
      const btn = document.createElement('button');
      btn.textContent = time;
      btn.className = 'time-btn';
      btn.addEventListener('click', () => {
        document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedTime = time;
        updateContinueButton();
      });
      timeGrid.appendChild(btn);
    });

    foods.forEach(food => {
      const btn = document.createElement('button');
      btn.textContent = food;
      btn.className = 'food-btn';
      btn.addEventListener('click', () => {
        document.querySelectorAll('.food-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedFood = food;
        confirmBtn.classList.add('ready');
      });
      foodGrid.appendChild(btn);
    });

    function moveNoButton() {
      const area = buttonArea.getBoundingClientRect();
      const btn = noBtn.getBoundingClientRect();

      const maxX = Math.max(0, area.width - btn.width);
      const maxY = Math.max(0, area.height - btn.height);

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
      noBtn.style.transform = 'none';
    }

    ['mouseenter', 'touchstart', 'pointerdown'].forEach(evt => {
      noBtn.addEventListener(evt, (e) => {
        e.preventDefault();
        moveNoButton();
      });
    });

    yesBtn.addEventListener('click', () => {
      step1.classList.add('hidden');
      step2.classList.remove('hidden');
    });

    dateInput.addEventListener('change', updateContinueButton);

    function updateContinueButton() {
      const ready = dateInput.value && selectedTime;
      continueBtn.classList.toggle('ready', !!ready);
    }

    continueBtn.addEventListener('click', () => {
      if (!dateInput.value || !selectedTime) return;
      step2.classList.add('hidden');
      step3.classList.remove('hidden');
    });

    backBtn.addEventListener('click', () => {
      step3.classList.add('hidden');
      step2.classList.remove('hidden');
    });

    confirmBtn.addEventListener('click', () => {
      if (!selectedFood) return;

      const d = new Date(dateInput.value + 'T12:00:00');
      const formatted = d.toLocaleDateString(undefined, {
        weekday: 'long',
        month: 'short',
        day: 'numeric'
      });

      document.getElementById('chosenDate').textContent = formatted;
      document.getElementById('chosenTime').textContent = selectedTime;
      document.getElementById('chosenFood').textContent = selectedFood;

      step3.classList.add('hidden');
      step4.classList.remove('hidden');

      launchConfetti();
    });

    function launchConfetti() {
      const colors = ['#e85f8c','#f3a7bd','#ffd2df','#c67b93','#ffffff'];
      for (let i = 0; i < 95; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.animationDuration = (2.2 + Math.random() * 2.8) + 's';
        el.style.animationDelay = (Math.random() * 0.8) + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 6000);
      }
    }

    for (let i = 0; i < 10; i++) {
      const h = document.createElement('div');
      h.className = 'floating-heart';
      h.textContent = '♥';
      h.style.left = Math.random() * 100 + 'vw';
      h.style.animationDelay = (Math.random() * 8) + 's';
      h.style.animationDuration = (7 + Math.random() * 5) + 's';
      document.body.appendChild(h);
    }
  </script>
</body>
</html>
